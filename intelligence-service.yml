server:
  port: 9030
  servlet.context-path: /intelligence

spring:
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2
          temperature: 0.7
          num-predict: 500 # Restrict the max number of tokens generated
      # Enable if you want to use local text-embeddings (e.g., for RAG)
      embedding:
        options:
          model: nomic-embed-text 

  datasource:
    url: jdbc:postgresql://localhost:5432/lovable-intelligence-db
    driver-class-name: org.postgresql.Driver

  # ai:
  #   retry:
  #       max-attempts: 5          # Number of retry attempts before giving up
  #       initial-interval: 2s     # Wait 2 seconds before the first retry
  #       multiplier: 2.0          # Double the wait time on subsequent retries (2s -> 4s -> 8s)
  #       max-interval: 15s 
  #   model.chat: openai
  #   openai:
