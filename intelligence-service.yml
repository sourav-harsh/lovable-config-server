server:
  port: 9030
  servlet.context-path: /intelligence

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/lovable-intelligence-db
    driver-class-name: org.postgresql.Driver

  ai:
  retry:
      max-attempts: 5          # Number of retry attempts before giving up
      initial-interval: 2s     # Wait 2 seconds before the first retry
      multiplier: 2.0          # Double the wait time on subsequent retries (2s -> 4s -> 8s)
      max-interval: 15s 
    model.chat: openai
    openai:
      api-key: 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
      base-url: https://openrouter.ai/api
      chat:
        options:
          model: recursive/flint-v1.0:free
          temperature: 0.2
      embedding:
        options:
          model: qwen/qwen3-embedding-8b

---

spring:
  config:
    activate:
      on-profile: k8s
  datasource:
    url: jdbc:postgresql://pgvector.lovable-core.svc.cluster.local:5432/intelligence_db
    username: intelligence_user
    password: ${DB_PASSWORD}

ai:
    openai:
      api-key: ${AI_API_KEY}
    chat:
        options:
          model: google/gemini-3-flash-preview
